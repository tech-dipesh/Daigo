name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: who
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: |
            ghcr.io/${{ steps.who.outputs.owner }}/daigo-app:${{ github.event.workflow_run.head_sha }}
            ghcr.io/${{ steps.who.outputs.owner }}/daigo-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ws
          push: true
          tags: |
            ghcr.io/${{ steps.who.outputs.owner }}/daigo-ws:${{ github.event.workflow_run.head_sha }}
            ghcr.io/${{ steps.who.outputs.owner }}/daigo-ws:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: compose.yml,Caddyfile
          target: daigo
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/daigo
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export OWNER=${{ steps.who.outputs.owner }} TAG=${{ github.event.workflow_run.head_sha }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
