name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  type:
    runs-on: ubuntu-latest
    env:
      DB_URL: postgresql://user:pass@localhost:5432/daigo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm type
